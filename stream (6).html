    :root {
      --mainColor: #EC4750;
      --darkBg: #1a1a24;
      --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding-bottom: 110px;
    }
    a, a:hover, a:focus { text-decoration: none; color: inherit; }

    /* ===== NAVBAR ===== */
    .header-nav {
      background: var(--darkBg);
      padding: 14px 20px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .header-nav .inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-nav .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }
    .header-nav .logo i {
      color: var(--mainColor);
      font-size: 1.4rem;
    }
    .header-nav nav ul {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      list-style: none;
    }
    .header-nav nav ul li a {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 6px 14px;
      display: block;
      transition: 0.2s;
    }
    .header-nav nav ul li a:hover { color: var(--mainColor); }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #5865F2;
      color: #fff !important;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      transition: 0.2s;
      white-space: nowrap;
    }
    .discord-btn:hover {
      background: #4752c4;
      color: #fff !important;
      transform: translateY(-1px);
    }
    .discord-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    @media (max-width: 650px) {
      .discord-btn { padding: 6px 12px; font-size: 12px; }
      .discord-btn img { width: 16px; height: 16px; }
    }

    /* ===== LAYOUT ===== */
    .main-container {
      max-width: 1400px;
      margin: 20px auto 0;
      padding: 0 15px;
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }
    .content-col {
      flex: 1;
      min-width: 0;
      margin-right: 320px;
    }
    .sidebar-col {
      width: 300px;
      position: fixed;
      top: 100px;
      right: calc((100vw - 1400px) / 2 + 15px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 40;
    }
    @media (max-width: 1460px) {
      .sidebar-col { right: 15px; }
    }

    /* ===== MATCH INFO BAR ===== */
    .match-info {
      background: #fff;
      border-radius: 14px;
      padding: 22px 26px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #eef2f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
    }
    .match-info .league {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      background: var(--mainColor);
      padding: 5px 14px;
      border-radius: 50px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 8px;
    }
    .match-info .teams {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .match-info .team {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .match-info .team img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .match-info .team .tname {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .match-info .vs {
      font-size: 0.95rem;
      font-weight: 800;
      color: #94a3b8;
      padding: 0 4px;
    }
    .match-info .meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      text-align: right;
    }
    .match-info .meta span i {
      color: var(--mainColor);
      margin-right: 6px;
      width: 14px;
    }

    /* ===== VIDEO BOX ===== */

      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);

    .video-box iframe {

      top: 0; left: 0;
      width: 100%;
      height: 100%;

    }

    /* ===== BACK BUTTON ===== */
    .back-btn {

      align-items: center;
      gap: 8px;
      background: var(--mainColor);
      color: #fff;

      border-radius: 50px;

    .back-btn:hover {

    }

    /* ===== AD SLOTS ===== */
    .ad-slot {
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;

    .ad-slot-sidebar { width: 300px; height: 250px; }
    .ad-slot-bottom { max-width: 468px; height: 60px; }
    .ad-close-btn {
      position: absolute;
      top: 6px;

      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;

    /* ===== FOOTER ===== */
    .footer {

      padding: 30px 0;

    .ad-slot-sticky-bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: auto;

      background: transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      .ad-slot-top { height: 70px; }
      .ad-slot-sticky-bottom .ad-inner { height: 70px; width: 100vw; max-width: 100vw; border-radius: 0; }
    }

  <script>
    function closeAd(adId) {
      const ad = document.getElementById(adId);
      if (!ad) return;
      ad.style.display = 'none';
      setTimeout(function() { ad.style.display = ''; }, 2500);
    }

    (function() {
      const API_URL = "https://ovogoal.cyou/api/v2/flyembed2.json";

      const params = new URLSearchParams(window.location.search);
      const matchId = params.get('id');

      const videoContainer = document.getElementById('videoContainer');
      const noStream = document.getElementById('noStream');

      function formatTime(timeStr) {
        if (!timeStr) return 'TBD';
        try {
          const [hourStr, minute] = timeStr.split(':');
          let hour = parseInt(hourStr, 10);
          const ampm = hour >= 12 ? 'PM' : 'AM';
          hour = hour % 12 || 12;
          return `${hour}:${minute} ${ampm}`;
        } catch (e) { return timeStr; }
      }

      function formatDate(dateStr) {
        if (!dateStr) return '—';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const monthIdx = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        return `${months[monthIdx]} ${day}, ${parts[0]}`;
      }

      function showError(msg) {
        noStream.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>' + msg + '</span>';
        noStream.style.display = 'flex';
      }

      if (!matchId) {
        showError('No match ID provided.');
        document.title = 'Stream Not Found — NFLBite';
        return;
      }

      fetch(API_URL)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (!Array.isArray(data)) throw new Error('Invalid data format');

          const match = data.find(m => String(m.MatchID) === String(matchId));

          if (!match) {
            showError('Match not found. It may have ended or been removed.');
            document.title = 'Match Not Found — NFLBite';
            return;
          }

          const team1 = match.Team1?.trim() || 'TBD';
          const team2 = match.Team2?.trim() || 'TBD';
          const league = (match.League || match.Sport || 'Sports').replace(/\r?\n/g, ' ').trim();
          const date = match.MatchDate || '';
          const time = match.MatchStartTime || '';
          const embed = match.IframeURL || '';

          document.getElementById('infoLeague').textContent = league;
          document.getElementById('infoDate').textContent = formatDate(date);
          document.getElementById('infoTime').textContent = formatTime(time);
          document.getElementById('infoTeam1').textContent = team1;
          document.getElementById('infoTeam2').textContent = team2;

          const img1 = document.getElementById('infoTeam1Logo');
          img1.src = match.Team1Logo || 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png';
          img1.onerror = function() { this.src = 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png'; };

          const img2 = document.getElementById('infoTeam2Logo');
          img2.src = match.Team2Logo || 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png';
          img2.onerror = function() { this.src = 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png'; };

          // ---------- AUTO TITLE ----------
          document.title = team1 + ' vs ' + team2 + ' | Live Stream — NFLBite';

          // ---------- LOAD IFRAME ----------
          if (embed && embed.trim() !== '') {
            noStream.style.display = 'none';
            const iframe = document.createElement('iframe');
            iframe.src = embed;
            iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
            iframe.allowFullscreen = true;
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('scrolling', 'no');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            videoContainer.appendChild(iframe);
          } else {
            showError('Stream not available for this match.');
          }
        })
        .catch(err => {
          console.error('Error loading match:', err);
          showError('Failed to load stream. Please try again later.');
          document.title = 'Error — NFLBite';
        });
    })();
  </script>
